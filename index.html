<script>
const base = [
{topic:"Mechanik",name:"Gleichförmige Bewegung",formula:"s = v · t",desc:"Konstante Geschwindigkeit; die Bewegungsrichtung bleibt gleich.",vars:[["s","zurückgelegter Weg","m"],["v","Geschwindigkeit","m/s"],["t","Zeit","s"]],extra:"v = s/t · t = s/v"},
{topic:"Mechanik",name:"Durchschnittsgeschwindigkeit",formula:"v̄ = Δs / Δt",desc:"Wegänderung pro Zeitintervall; nicht zwingend konstante Geschwindigkeit.",vars:[["Δs","Wegänderung","m"],["Δt","Zeitintervall","s"]],extra:""},
{topic:"Mechanik",name:"Beschleunigung",formula:"a = Δv / Δt",desc:"Mittlere Beschleunigung im betrachteten Zeitintervall.",vars:[["a","Beschleunigung","m/s²"],["Δv","Geschwindigkeitsänderung","m/s"],["Δt","Zeitintervall","s"]],extra:"Bei konstanter Beschleunigung: v = v₀ + a·t"},
{topic:"Mechanik",name:"Gleichmäßig beschleunigte Bewegung (Weg)",formula:"s = s₀ + v₀t + ½at²",desc:"Gilt bei konstanter Beschleunigung entlang einer Achse.",vars:[["s","Ort zum Zeitpunkt t","m"],["s₀","Anfangsort","m"],["v₀","Anfangsgeschwindigkeit","m/s"],["a","konstante Beschleunigung","m/s²"],["t","Zeit","s"]],extra:""},
{topic:"Mechanik",name:"Geschwindigkeit ohne Zeit",formula:"v² = v₀² + 2a(s − s₀)",desc:"Konstante Beschleunigung; eliminiert die Zeit aus den Bewegungsgleichungen.",vars:[["v","Endgeschwindigkeit","m/s"],["v₀","Anfangsgeschwindigkeit","m/s"],["a","Beschleunigung","m/s²"],["s−s₀","Ortsänderung","m"]],extra:""},
{topic:"Mechanik",name:"Newton: Kraft",formula:"F = m · a",desc:"Resultierende Kraft bewirkt die Beschleunigung eines Körpers (klassische Mechanik).",vars:[["F","resultierende Kraft","N"],["m","Masse","kg"],["a","Beschleunigung","m/s²"]],extra:"1 N = 1 kg·m/s²"},
{topic:"Mechanik",name:"Gewichtskraft",formula:"Fᴳ = m · g",desc:"Nahe der Erdoberfläche mit g ≈ 9,81 m/s².",vars:[["Fᴳ","Gewichtskraft","N"],["m","Masse","kg"],["g","Fallbeschleunigung","m/s²"]],extra:""},
{topic:"Mechanik",name:"Impuls",formula:"p = m · v",desc:"Impuls eines Körpers in der klassischen Mechanik.",vars:[["p","Impuls","kg·m/s"],["m","Masse","kg"],["v","Geschwindigkeit","m/s"]],extra:""},
{topic:"Mechanik",name:"Impulserhaltung",formula:"Σp vorher = Σp nachher",desc:"In einem abgeschlossenen System bleibt der Gesamtimpuls erhalten, wenn keine äußere resultierende Kraft wirkt.",vars:[["p","Impuls","kg·m/s"]],extra:""},
{topic:"Mechanik",name:"Arbeit (konstante Kraft)",formula:"W = F · s · cos(α)",desc:"Kraft verrichtet Arbeit entlang der Verschiebung. Bei paralleler Kraft: α = 0.",vars:[["W","Arbeit","J"],["F","Kraft","N"],["s","Weg","m"],["α","Winkel zwischen Kraft und Weg","°"]],extra:"Bei paralleler Kraft W = F·s"},
{topic:"Mechanik",name:"Kinetische Energie",formula:"Eₖ = ½ m v²",desc:"Bewegungsenergie eines Körpers in der klassischen Mechanik.",vars:[["Eₖ","kinetische Energie","J"],["m","Masse","kg"],["v","Geschwindigkeit","m/s"]],extra:""},
{topic:"Mechanik",name:"Potenzielle Energie (Schwerefeld)",formula:"Eₚ = m · g · h",desc:"Bezogen auf eine gewählte Höhe h nahe der Erdoberfläche, wo g näherungsweise konstant ist.",vars:[["Eₚ","potenzielle Energie","J"],["m","Masse","kg"],["g","Fallbeschleunigung","m/s²"],["h","Höhe über Bezugspunkt","m"]],extra:""},
{topic:"Mechanik",name:"Leistung",formula:"P = W / Δt",desc:"Über ein Zeitintervall gemittelte umgesetzte Arbeit pro Zeit.",vars:[["P","Leistung","W"],["W","Arbeit","J"],["Δt","Zeitintervall","s"]],extra:"Bei konstanter Geschwindigkeit und paralleler Kraft: P = F·v"},
{topic:"Mechanik",name:"Dichte",formula:"ρ = m / V",desc:"Masse pro Volumen eines Stoffes; bei homogenen Stoffen.",vars:[["ρ","Dichte","kg/m³"],["m","Masse","kg"],["V","Volumen","m³"]],extra:""},
{topic:"Mechanik",name:"Druck",formula:"p = F⊥ / A",desc:"Kraftkomponente senkrecht zur Fläche pro Fläche.",vars:[["p","Druck","Pa"],["F⊥","senkrechte Kraftkomponente","N"],["A","Fläche","m²"]],extra:"1 Pa = 1 N/m²"},
{topic:"Mechanik",name:"Hydrostatischer Druck",formula:"Δp = ρ · g · Δh",desc:"Druckdifferenz in einer ruhenden Flüssigkeit; Dichte und g näherungsweise konstant.",vars:[["Δp","Druckdifferenz","Pa"],["ρ","Flüssigkeitsdichte","kg/m³"],["g","Fallbeschleunigung","m/s²"],["Δh","Höhendifferenz","m"]],extra:""},
{topic:"Mechanik",name:"Hookesches Gesetz",formula:"F = −D · x",desc:"Ideale Feder im linearen elastischen Bereich; das Minus kennzeichnet die rückstellende Richtung.",vars:[["F","Rückstellkraft","N"],["D","Federkonstante","N/m"],["x","Auslenkung von Ruhelage","m"]],extra:"Betrag: |F| = D·|x|"},
{topic:"Mechanik",name:"Kreisbewegung: Zentripetalbeschleunigung",formula:"aᶻ = v² / r",desc:"Beschleunigung zum Kreismittelpunkt bei Kreisbewegung.",vars:[["aᶻ","Zentripetalbeschleunigung","m/s²"],["v","Bahngeschwindigkeit","m/s"],["r","Radius","m"]],extra:"Fᶻ = m·v²/r"},
{topic:"Mechanik",name:"Gravitationsgesetz",formula:"F = G · m₁m₂ / r²",desc:"Betrag der Gravitationskraft zweier punktförmiger Massen bzw. kugelsymmetrischer Körper außerhalb ihrer Oberfläche.",vars:[["F","Gravitationskraft","N"],["G","Gravitationskonstante","N·m²/kg²"],["m₁, m₂","Massen","kg"],["r","Abstand der Massenschwerpunkte","m"]],extra:"G ≈ 6,674·10⁻¹¹ N·m²/kg²"},
{topic:"Elektrizitätslehre",name:"Elektrische Ladung",formula:"Q = I · t",desc:"Bei konstantem Strom; allgemein ist Q das Zeitintegral der Stromstärke.",vars:[["Q","elektrische Ladung","C"],["I","Stromstärke","A"],["t","Zeit","s"]],extra:"1 C = 1 A·s"},
{topic:"Elektrizitätslehre",name:"Stromstärke",formula:"I = ΔQ / Δt",desc:"Mittlere Ladungsmenge, die pro Zeit durch einen Querschnitt fließt.",vars:[["I","Stromstärke","A"],["ΔQ","Ladungsänderung / transportierte Ladung","C"],["Δt","Zeitintervall","s"]],extra:""},
{topic:"Elektrizitätslehre",name:"Spannung",formula:"U = W / Q",desc:"Energie bzw. Arbeit pro Ladung bei der Übertragung zwischen zwei Punkten.",vars:[["U","elektrische Spannung","V"],["W","übertragene Energie / Arbeit","J"],["Q","Ladung","C"]],extra:"1 V = 1 J/C"},
{topic:"Elektrizitätslehre",name:"Ohmsches Gesetz",formula:"U = R · I",desc:"Für ohmsche Bauteile bei konstanten physikalischen Bedingungen, wenn R unabhängig von U und I ist.",vars:[["U","Spannung","V"],["R","Widerstand","Ω"],["I","Stromstärke","A"]],extra:"I = U/R · R = U/I"},
{topic:"Elektrizitätslehre",name:"Elektrischer Widerstand",formula:"R = ρ · l / A",desc:"Widerstand eines homogenen Leiters mit konstantem spezifischem Widerstand und gleichmäßigem Querschnitt.",vars:[["R","Widerstand","Ω"],["ρ","spezifischer Widerstand","Ω·m"],["l","Leiterlänge","m"],["A","Querschnittsfläche","m²"]],extra:""},
{topic:"Elektrizitätslehre",name:"Elektrische Leistung",formula:"P = U · I",desc:"Leistung bei elektrischer Energieübertragung; bei Gleichstrom bzw. geeigneten Effektivwerten.",vars:[["P","elektrische Leistung","W"],["U","Spannung","V"],["I","Stromstärke","A"]],extra:"Für ohmschen Widerstand: P = I²R = U²/R"},
{topic:"Elektrizitätslehre",name:"Elektrische Energie",formula:"E = P · t",desc:"Bei konstanter Leistung; bei variabler Leistung gilt E = ∫P(t)dt.",vars:[["E","elektrische Energie","J"],["P","Leistung","W"],["t","Zeit","s"]],extra:"E = U·I·t bei konstantem U und I"},
{topic:"Elektrizitätslehre",name:"Kapazität",formula:"C = Q / U",desc:"Definition der Kapazität eines Kondensators; bei linearem Kondensator gilt Q proportional U.",vars:[["C","Kapazität","F"],["Q","Ladung","C"],["U","Spannung","V"]],extra:"1 F = 1 C/V"},
{topic:"Elektrizitätslehre",name:"Plattenkondensator",formula:"C = ε₀ · εᵣ · A / d",desc:"Idealer Plattenkondensator; Randfelder vernachlässigt, homogenes Dielektrikum.",vars:[["C","Kapazität","F"],["ε₀","elektrische Feldkonstante","F/m"],["εᵣ","relative Permittivität","1"],["A","Plattenfläche","m²"],["d","Plattenabstand","m"]],extra:""},
{topic:"Elektrizitätslehre",name:"Energie im Kondensator",formula:"E = ½ C U²",desc:"Gespeicherte Energie eines idealen Kondensators.",vars:[["E","Energie","J"],["C","Kapazität","F"],["U","Spannung","V"]],extra:"E = Q²/(2C) = ½QU"},
{topic:"Elektrizitätslehre",name:"Kondensatoren parallel",formula:"C₍ges₎ = C₁ + C₂ + …",desc:"Parallelschaltung: gleiche Spannung an allen Kondensatoren.",vars:[["C₍ges₎","Gesamtkapazität","F"],["Cᵢ","Einzelkapazität","F"]],extra:""},
{topic:"Elektrizitätslehre",name:"Kondensatoren in Reihe",formula:"1/C₍ges₎ = Σ 1/Cᵢ",desc:"Reihenschaltung idealer Kondensatoren; gleiche Ladungsbeträge.",vars:[["C₍ges₎","Gesamtkapazität","F"],["Cᵢ","Einzelkapazität","F"]],extra:"Für zwei: Cges = C₁C₂/(C₁+C₂)"},
{topic:"Elektrizitätslehre",name:"Elektrisches Feld: Kraft",formula:"F = q · E",desc:"Kraft auf eine Ladung im elektrischen Feld; Vorzeichen von q bestimmt die Richtung.",vars:[["F","elektrische Kraft","N"],["q","Ladung","C"],["E","Feldstärke","N/C bzw. V/m"]],extra:""},
{topic:"Elektrizitätslehre",name:"Homogenes elektrisches Feld",formula:"E = U / d",desc:"Betrag der Feldstärke zwischen parallelen Platten, wenn das Feld homogen ist.",vars:[["E","Feldstärke","V/m"],["U","Spannung","V"],["d","Plattenabstand","m"]],extra:""},
{topic:"Magnetismus",name:"Lorentzkraft (bewegte Ladung)",formula:"F = |q| · v · B · sin(α)",desc:"Betrag der magnetischen Kraft auf eine bewegte Ladung; α ist der Winkel zwischen v und B.",vars:[["F","magnetische Kraft","N"],["q","Ladung","C"],["v","Geschwindigkeit","m/s"],["B","magnetische Flussdichte","T"],["α","Winkel zwischen v und B","°"]],extra:"Bei v ⟂ B: F = |q|vB"},
{topic:"Magnetismus",name:"Kraft auf stromdurchflossenen Leiter",formula:"F = B · I · l · sin(α)",desc:"Gerader Leiter im homogenen Magnetfeld; α zwischen Leiter/Stromrichtung und B.",vars:[["F","magnetische Kraft","N"],["B","Flussdichte","T"],["I","Stromstärke","A"],["l","Leiterlänge im Feld","m"],["α","Winkel","°"]],extra:"Bei senkrechter Anordnung: F = B·I·l"},
{topic:"Magnetismus",name:"Magnetischer Fluss",formula:"Φ = B · A · cos(α)",desc:"Fluss durch eine ebene Fläche bei homogenem B; α zwischen B und Flächennormale.",vars:[["Φ","magnetischer Fluss","Wb"],["B","magnetische Flussdichte","T"],["A","Fläche","m²"],["α","Winkel zur Flächennormale","°"]],extra:""},
{topic:"Magnetismus",name:"Induktionsgesetz (Faraday)",formula:"Uᵢ = − dΦ/dt",desc:"Induzierte Spannung in einer Schleife; das Minuszeichen steht für die Lenzsche Regel. Für N Windungen: Uᵢ = −N·dΦ/dt.",vars:[["Uᵢ","Induktionsspannung","V"],["Φ","magnetischer Fluss","Wb"],["t","Zeit","s"],["N","Windungszahl","1"]],extra:"Bei mittlerer Änderung: Uᵢ ≈ −N·ΔΦ/Δt"},
{topic:"Schwingungen & Wellen",name:"Periodendauer und Frequenz",formula:"f = 1 / T",desc:"Zusammenhang für periodische Vorgänge.",vars:[["f","Frequenz","Hz"],["T","Periodendauer","s"]],extra:""},
{topic:"Schwingungen & Wellen",name:"Wellengeschwindigkeit",formula:"v = λ · f",desc:"Für eine Welle mit Wellenlänge λ und Frequenz f.",vars:[["v","Ausbreitungsgeschwindigkeit","m/s"],["λ","Wellenlänge","m"],["f","Frequenz","Hz"]],extra:""},
{topic:"Schwingungen & Wellen",name:"Federpendel",formula:"T = 2π · √(m / D)",desc:"Ideale Feder, kleine bzw. beliebige Schwingung im linearen Hooke-Bereich, ohne Dämpfung.",vars:[["T","Periodendauer","s"],["m","schwingende Masse","kg"],["D","Federkonstante","N/m"]],extra:""},
{topic:"Schwingungen & Wellen",name:"Fadenpendel",formula:"T = 2π · √(l / g)",desc:"Kleine Auslenkungen (Kleinwinkelnäherung), idealer Faden und keine Dämpfung.",vars:[["T","Periodendauer","s"],["l","Pendellänge","m"],["g","Fallbeschleunigung","m/s²"]],extra:""},
{topic:"Schwingungen & Wellen",name:"Harmonische Schwingung",formula:"x(t) = A · cos(ωt + φ)",desc:"Ideale harmonische Schwingung; Wahl von Cosinus und Phase ist eine Konvention.",vars:[["x","Auslenkung","m"],["A","Amplitude","m"],["ω","Kreisfrequenz","rad/s"],["t","Zeit","s"],["φ","Phase","rad"]],extra:"ω = 2πf"},
{topic:"Optik",name:"Reflexionsgesetz",formula:"α = β",desc:"Winkel werden jeweils zum Lot gemessen.",vars:[["α","Einfallswinkel","°"],["β","Reflexionswinkel","°"]],extra:""},
{topic:"Optik",name:"Brechung (Snellius)",formula:"n₁ · sin(α₁) = n₂ · sin(α₂)",desc:"Für Licht an einer Grenzfläche zweier isotroper Medien; Winkel zum Lot.",vars:[["n₁, n₂","Brechungsindizes","1"],["α₁","Einfallswinkel","°"],["α₂","Brechungswinkel","°"]],extra:""},
{topic:"Optik",name:"Brechungsindex",formula:"n = c / v",desc:"Für ein Medium; v ist die Phasengeschwindigkeit des Lichts im Medium.",vars:[["n","Brechungsindex","1"],["c","Lichtgeschwindigkeit im Vakuum","m/s"],["v","Lichtgeschwindigkeit im Medium","m/s"]],extra:""},
{topic:"Optik",name:"Linsengleichung",formula:"1/f = 1/g + 1/b",desc:"Dünne Linse in paraxialer Näherung; Vorzeichen gemäß verwendeter Konvention beachten.",vars:[["f","Brennweite","m"],["g","Gegenstandsweite","m"],["b","Bildweite","m"]],extra:""},

const stored=JSON.parse(localStorage.getItem("physik_v2_custom")||"[]");
let custom=stored,hidden=JSON.parse(localStorage.getItem("physik_hidden")||"[]"),favorites=JSON.parse(localStorage.getItem("physik_favs")||"[]"),learned=JSON.parse(localStorage.getItem("physik_learned")||"[]"),order=JSON.parse(localStorage.getItem("physik_order")||"[]");
let active="Alle",query="",showHidden=false;
const all=()=>[...base,...custom];
const $=s=>document.querySelector(s);
const id=f=>f.id||"b_"+f.name;
function persist(){localStorage.setItem("physik_v2_custom",JSON.stringify(custom));localStorage.setItem("physik_hidden",JSON.stringify(hidden));localStorage.setItem("physik_favs",JSON.stringify(favorites));localStorage.setItem("physik_learned",JSON.stringify(learned));localStorage.setItem("physik_order",JSON.stringify(order))}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function notify(s){$("#toast").textContent=s;$("#toast").classList.add("show");setTimeout(()=>$("#toast").classList.remove("show"),1900)}
/* Fachnotation: explizite LaTeX-Darstellung für Brüche, Wurzeln, Indizes und Summen. */
const tex={
"Durchschnittsgeschwindigkeit":String.raw`\bar v=\frac{\Delta s}{\Delta t}`,
"Beschleunigung":String.raw`a=\frac{\Delta v}{\Delta t}`,

function draw(){
 const topics=["Alle","Favoriten",...new Set(all().map(f=>f.topic)),"Ausgeblendete"];
 $("#sidebar").innerHTML='<div class="sidehead">Themen</div>'+topics.map(t=>`<button class="nav ${active===t?'active':''}" data-t="${safe(t)}">${safe(t)}<span class="num">${t==="Alle"?all().length:t==="Favoriten"?favorites.length:t==="Ausgeblendete"?hidden.length:all().filter(f=>f.topic===t).length}</span></button>`).join("");
 $("#sidebar").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{active=b.dataset.t;showHidden=active==="Ausgeblendete";draw()});
 let list=all().filter(f=>{let key=id(f);return (active==="Alle"||active==="Favoriten"&&favorites.includes(key)||active==="Ausgeblendete"&&hidden.includes(key)||f.topic===active)&& (showHidden?hidden.includes(key):!hidden.includes(key)) && (!query||[f.name,f.topic,f.formula,f.desc,f.extra,...(f.vars||[]).flat()].join(" ").toLowerCase().includes(query))});
 if($("#sort").value==="alpha")list.sort((a,b)=>a.name.localeCompare(b.name));
 else if($("#sort").value==="topic")list.sort((a,b)=>a.topic.localeCompare(b.topic)||a.name.localeCompare(b.name));
 else list.sort((a,b)=>{let ia=order.indexOf(id(a)),ib=order.indexOf(id(b));return (ia<0?9999:ia)-(ib<0?9999:ib)});
 $("#heading").textContent=active==="Alle"?"Alle Formeln":active;
 $("#subheading").textContent=`${list.length} Formeln · Definitionen und SI-Einheiten`;
 $("#cards").innerHTML=list.length?list.map((f,i)=>{let key=id(f),isCustom=!!f.custom;return `<article class="card"><div class="topline"><div><div class="topic">${safe(f.topic)}</div><h2>${safe(f.name)}</h2></div><div class="tools"><button class="iconbtn" title="Favorit" data-fav="${safe(key)}">${favorites.includes(key)?"★":"☆"}</button><button class="iconbtn" title="Nach oben" data-up="${safe(key)}">↑</button><button class="iconbtn" title="Nach unten" data-down="${safe(key)}">↓</button><button class="iconbtn" title="Ausblenden" data-hide="${safe(key)}">◉</button>${isCustom?`<button class="iconbtn" title="Löschen" data-del="${safe(key)}">×</button>`:""}</div></div>
 <div class="formula">\\[${tex[f.name]||safe(f.formula)}\\]</div><p class="definition">${safe(f.desc||"Keine Definition hinterlegt.")}</p><div class="vars">${(f.vars||[]).map(v=>`<div class="vrow"><span class="sym">${safe(v[0])}</span><span>${safe(v[1])}</span><span class="unit">${safe(v[2])}</span></div>`).join("")}</div>${f.extra?`<div class="extra">${safe(f.extra)}</div>`:""}
 <div class="status"><span>${isCustom?"Eigene Formel":"Formel"}</span><button class="iconbtn ${learned.includes(key)?"learned":""}" data-learn="${safe(key)}">${learned.includes(key)?"✓ Gelernt":"+ Als gelernt markieren"}</button></div></article>`}).join(""):'<div class="empty">Keine Formeln in dieser Ansicht.</div>';
 if(window.MathJax?.typesetPromise) MathJax.typesetPromise([$("#cards")]);
 $("#cards").querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>toggle(favorites,b.dataset.fav));
 $("#cards").querySelectorAll("[data-learn]").forEach(b=>b.onclick=()=>toggle(learned,b.dataset.learn));
 $("#cards").querySelectorAll("[data-hide]").forEach(b=>b.onclick=()=>{hidden.push(b.dataset.hide);persist();draw()});
 $("#cards").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{custom=custom.filter(f=>id(f)!==b.dataset.del);persist();draw();notify("Formel gelöscht")});
 $("#cards").querySelectorAll("[data-up],[data-down]").forEach(b=>b.onclick=()=>move(b.dataset.up||b.dataset.down,b.hasAttribute("data-up")?-1:1));
}
function toggle(arr,key){let i=arr.indexOf(key);i<0?arr.push(key):arr.splice(i,1);persist();draw()}
function move(key,delta){let ids=all().map(id);let pos=order.length?order.slice():ids;ids.forEach(x=>{if(!pos.includes(x))pos.push(x)});let i=pos.indexOf(key),j=i+delta;if(j<0||j>=pos.length)return;[pos[i],pos[j]]=[pos[j],pos[i]];order=pos;persist();draw()}
$("#search").oninput=e=>{query=e.target.value.toLowerCase().trim();draw()};$("#reset").onclick=()=>{$("#search").value="";query="";draw()};$("#sort").onchange=draw;
$("#showHidden").onclick=()=>{active=active==="Ausgeblendete"?"Alle":"Ausgeblendete";showHidden=active==="Ausgeblendete";draw()};
$("#add").onclick=()=>{$("#form").reset();$("#modalbg").classList.add("open")};$("#cancel").onclick=()=>$("#modalbg").classList.remove("open");
$("#form").onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),vars=String(d.get("vars")).split("\n").map(x=>x.split("|").map(y=>y.trim())).filter(x=>x.length>=3&&x[0]);let f={id:"custom_"+Date.now(),custom:true,name:d.get("name").trim(),topic:d.get("topic").trim(),formula:d.get("formula").trim(),desc:d.get("desc").trim(),vars,extra:d.get("extra").trim()};custom.push(f);order.push(id(f));persist();$("#modalbg").classList.remove("open");active=f.topic;draw();notify("Formel gespeichert")};
$("#export").onclick=()=>{let blob=new Blob([JSON.stringify({custom,hidden,favorites,learned,order},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="physik-backup.json";a.click();URL.revokeObjectURL(a.href)};
$("#import").onclick=()=>$("#file").click();$("#file").onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());custom=d.custom||[];hidden=d.hidden||[];favorites=d.favorites||[];learned=d.learned||[];order=d.order||[];persist();draw();notify("Backup importiert")}catch{notify("Import fehlgeschlagen")}e.target.value=""};
draw();
</script></body></html>
